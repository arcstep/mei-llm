<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>needle-vrm-agent-v0 playground</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #12141a;
        --panel: #1c2028;
        --line: #2c3340;
        --text: #e8eaed;
        --muted: #9aa3b2;
        --accent: #7eb8ff;
        --empty: #c45c5c;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; }
      .wrap { display: grid; grid-template-columns: 1fr 320px; grid-template-rows: 1fr 220px; height: 100%; }
      #stage { grid-row: 1; grid-column: 1; position: relative; background: #0b0d12; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      .list { grid-row: 1; grid-column: 2; overflow: auto; border-left: 1px solid var(--line); background: var(--panel); }
      .hud { grid-column: 1 / -1; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 0; background: #0e1116; }
      .hud pre { margin: 0; padding: 10px 12px; overflow: auto; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .hud .label { padding: 8px 12px 0; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
      button.item { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: inherit; padding: 8px 10px; cursor: pointer; }
      button.item:hover, button.item.active { background: #273044; }
      button.item .id { color: var(--accent); font-family: ui-monospace, monospace; }
      button.item.empty .id { color: var(--empty); }
      .meta { position: absolute; left: 12px; top: 10px; color: var(--muted); max-width: 70%; }
      .badge { display: inline-block; margin-right: 6px; padding: 1px 6px; border-radius: 4px; background: #2a3344; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
          "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.4/lib/three-vrm.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div class="wrap">
      <div id="stage">
        <div class="meta" id="meta">loading…</div>
      </div>
      <div class="list" id="list"></div>
      <div class="hud">
        <div>
          <div class="label">gold function_calls</div>
          <pre id="hud-gold">[]</pre>
        </div>
        <div>
          <div class="label">item / scene</div>
          <pre id="hud-item"></pre>
        </div>
      </div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
