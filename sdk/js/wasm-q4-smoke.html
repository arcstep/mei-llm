<!doctype html>
<meta charset="utf-8" />
<title>51M Q4 WASM smoke</title>
<p>Quantized-only WASM complete() smoke. Float npz is refused.</p>
<pre id="out">loading…</pre>
<script type="module">
  const out = document.getElementById("out");
  const workerUrl = new URL("./wasm-q4-worker.js", import.meta.url);
  workerUrl.search = location.search;
  const worker = new Worker(workerUrl, { type: "module" });
  const publish = (report) => {
    out.textContent = JSON.stringify(report, null, 2);
    fetch("/__mei_51m_report__", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(report),
    }).catch(() => {});
    worker.terminate();
  };
  worker.onmessage = (ev) => {
    publish(ev.data);
  };
  worker.onerror = (err) => {
    publish({
        error: String(err && err.message ? err.message : err),
        filename: err && err.filename,
        lineno: err && err.lineno,
        colno: err && err.colno,
        ok: false,
        browser_worker: true,
      });
  };
</script>
