<!doctype html><html lang="zh"><meta charset="utf-8"><title>Mei 多核协同实验</title><style>body{font:16px system-ui;margin:32px;max-width:1000px}button{padding:12px;margin:8px}pre{white-space:pre-wrap;font-size:13px}</style><h1>Mei 浏览器多核协同实验</h1><p>同一份 900M-SFT 权重；完整 LM 数值推理。CPU 测量 0/1/2/4/8 个矩阵 Worker，GPU 比较 32/64/128/256 工作组与矩阵分块。预热后交替顺序重复 3 轮，分开记录输入处理和逐 token 解码。仅本机，未纳入质量或发布验收。</p><button id="cpu">运行 CPU 多 Worker 实验</button><button id="gpu">运行 GPU 并行粒度实验</button><button id="cpu-focus">复核 CPU 阶段自适应</button><button id="gpu-focus">复核 GPU 自适应分块</button><button id="stop" disabled>停止实验</button><pre id="status">等待运行</pre><pre id="result"></pre><script type="module">
let worker;const status=document.querySelector('#status'),result=document.querySelector('#result');
function stop(){worker?.terminate();worker=null;document.querySelectorAll('button').forEach(b=>b.disabled=b.id==='stop');}
for(const mode of ['cpu','gpu','cpu-focus','gpu-focus'])document.querySelector('#'+mode).onclick=()=>{stop();document.querySelectorAll('button').forEach(b=>b.disabled=b.id!=='stop');result.textContent='';status.textContent='初始化…';worker=new Worker('/parallel-worker.mjs',{type:'module'});worker.onerror=e=>{status.textContent=e.message;stop();};worker.onmessage=async({data})=>{if(data.progress)status.textContent=data.progress;if(data.error){status.textContent=data.error;stop();}if(data.report){const saved=await fetch('/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data.report)}).then(r=>r.json());result.textContent=JSON.stringify({saved,summary:data.report.summary,checks:data.report.checks},null,2);status.textContent='完成，原始测量已保存：'+saved.id;stop();}};worker.postMessage({mode:mode.split('-')[0],focused:mode.endsWith('-focus'),rounds:mode.endsWith('-focus')?5:3,lens:mode.endsWith('-focus')?[128,512]:[1,128,512]});};document.querySelector('#stop').onclick=()=>{stop();status.textContent='已停止';};
</script></html>
