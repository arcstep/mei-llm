<!doctype html><html lang="zh"><meta charset="utf-8"><title>Mei GPU 解码剖析</title><h1>Mei GPU 解码剖析</h1><p>读取真实 GPU 时间戳，区分指令编码、GPU 计算和等待回读。逐算子剖析会增加 pass 边界，仅作定位；另测整个计算 pass。</p><button id="run">运行解码剖析</button><pre id="out">等待运行</pre><script type="module">
const button=document.querySelector('#run'),out=document.querySelector('#out');button.onclick=()=>{button.disabled=true;const w=new Worker('/decode-worker.mjs',{type:'module'});w.onmessage=async({data})=>{if(data.progress)out.textContent=data.progress;if(data.error){out.textContent=data.error;button.disabled=false;w.terminate();}if(data.report){const saved=await fetch('/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data.report)}).then(r=>r.json());out.textContent=JSON.stringify({saved,checks:data.report.checks,runs:data.report.runs?.map(x=>({...x,steps:undefined,generated:undefined})),profiles:data.report.profiles},null,2);button.disabled=false;w.terminate();}};w.onerror=e=>{out.textContent=e.message;button.disabled=false;w.terminate();};w.postMessage({});};
</script></html>
