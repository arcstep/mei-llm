[package]
name = "mei-sdk-core"
version = "0.2.0-experimental"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "MEI Runtime portable core: protocol, model package, session API"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
unicode-normalization = { workspace = true }

[features]
wasm-fast-kernels = []
wasm-prefix-cache = []
wasm-approx-kernels = ["wasm-fast-kernels"]
wasm-tiled-prefill = ["wasm-fast-kernels"]
numeric-bench = ["wasm-fast-kernels"]
wasm-parallel = ["numeric-bench", "wasm-tiled-prefill"]
