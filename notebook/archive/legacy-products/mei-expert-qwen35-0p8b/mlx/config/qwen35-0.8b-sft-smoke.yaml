# Phase SFT smoke on Mac (MLX). Pair with exports/sft-smoke-v0/
# Base: Qwen/Qwen3.5-0.8B — do not swap to edge/large models this phase.
model: "Qwen/Qwen3.5-0.8B"
train: true
fine_tune_type: lora
data: "exports/sft-smoke-v0"
adapter_path: "adapters/qwen35-0.8b-sft-smoke"
seed: 42
num_layers: -1
batch_size: 1
iters: 150
val_batches: 4
learning_rate: 1.0e-5
steps_per_report: 10
steps_per_eval: 40
save_every: 150
test: false
max_seq_length: 2048
grad_checkpoint: true
mask_prompt: true
lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj"]
  rank: 8
  scale: 16.0
  dropout: 0.05
